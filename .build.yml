image: debian/stable
packages:
  - python3
  - python3-pip
sources:
  - https://git.sr.ht/~itsams_wav/smart-light
tasks:
  - build-detection-module: |
      cd smart-light/DetectionModule
      python3 -m pip install --break-system-packages --upgrade platformio
      export PATH="$HOME/.local/bin:$PATH"
      python3 include_config_header.py
      pio pkg update
      pio run
  - build-lamp-module: |
      export PATH="$HOME/.local/bin:$PATH"
      cd smart-light/Lamp
      python3 include_config_header.py
      pio pkg update
      pio run
artifacts:
  - smart-light/DetectionModule/.pio/build/
  - smart-light/Lamp/.pio/build/
