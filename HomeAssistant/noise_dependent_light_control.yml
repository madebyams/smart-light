sequence:
  - if:
      - type: is_sound_pressure
        condition: device
        device_id: c607277331953f6900ae6c8f41a6d027
        entity_id: a8fa633a7b090b5cf43ff31253c983b1
        domain: sensor
        above: 2000
    then:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "ON",
              "mode": "party",
              "brightness": 255
            }
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "ON",
              "mode": "color",
              "color": {
                "r": 255,
                "g": 255,
                "b": 255,
                "w": 255
              },
              "brightness": 255
            }
alias: Noise dependent lamp control
description: ""
