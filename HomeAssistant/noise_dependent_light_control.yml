sequence:
  - if:
      - type: is_sound_pressure
        condition: device
        device_id: 69d6c23daffc370939cf995e2f8507c4
        entity_id: 858b5c3fa043904ecfcd44c4139b006f
        domain: sensor
        above: 50
    then:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "ON",
              "mode": "party",
              "brightness": 255
            }
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "ON",
              "mode": "color",
              "color": {
                "r": 255,
                "g": 255,
                "b": 255,
                "w": 255
              },
              "brightness": 255
            }
          topic: home/ledsteip/set
alias: Noise dependent lamp control
description: ""
