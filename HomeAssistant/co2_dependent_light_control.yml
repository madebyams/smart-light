sequence:
  - if:
      - type: is_carbon_dioxide
        condition: device
        device_id: 3253637d30a83f05fc0d82d6f0958558
        entity_id: 692888b5e1b4c32f830b57b2b2a39ec1
        domain: sensor
        above: 2500
    then:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "ON",
              "mode": "color",
              "color": {
                "r": 255,
                "g": 0,
                "b": 0,
                "w": 0
              },
              "brightness": 255
            }
    else:
      - action: script.room_light_dependant_lamp_control
        metadata: {}
        data: {}
alias: CO2 dependent lamp control
description: ""
