sequence:
  - if:
      - type: is_illuminance
        condition: device
        device_id: c2ddb728912e5e44ff14115070f4454b
        entity_id: f66d3282624fa16ff75413f99b2ec0cc
        domain: sensor
        below: 10
    then:
      - action: script.party_mode_in_case_of_loud_music
        metadata: {}
        data: {}
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "OFF",
              "mode": "color",
              "color": {
                "r": 0,
                "g": 0,
                "b": 0,
                "w": 0
              },
              "brightness": 0
            }
          topic: home/ledstrip/set
alias: Brightness dependent Lamp control
description: ""
