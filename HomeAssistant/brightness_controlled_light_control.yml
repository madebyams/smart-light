sequence:
  - if:
      - type: is_illuminance
        condition: device
        device_id: 70c167fef056ee3237e15f83841f3b87
        entity_id: c23e7c5a6f416bf90acb3516d3f6b27a
        domain: sensor
        below: 200
    then:
      - action: script.party_mode_in_case_of_loud_music
        metadata: {}
        data: {}
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "OFF",
              "mode": "color",
              "color": {
                "r": 0,
                "g": 0,
                "b": 0,
                "w": 0
              },
              "brightness": 0
            }
          topic: home/ledstrip/set
alias: Brightness dependent Lamp control
description: ""
