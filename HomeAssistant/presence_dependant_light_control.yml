sequence:
  - if:
      - condition: or
        conditions:
          - type: is_present
            condition: device
            device_id: c15ab93fe83f1b57b8ec12354516abbd
            entity_id: 8ee7004d479ca8e5148db78838f561f6
            domain: binary_sensor
          - type: is_carbon_dioxide
            condition: device
            device_id: e20012aa2f19eb26f8c9673d23c5f7fd
            entity_id: 89994147c93dea0f7ca94771328d526b
            domain: sensor
            above: 500
            below: 1000
          - type: is_sound_pressure
            condition: device
            device_id: c607277331953f6900ae6c8f41a6d027
            entity_id: a8fa633a7b090b5cf43ff31253c983b1
            domain: sensor
            above: 1000
    then:
      - action: script.get_back_to_normal_for_corresponding_co2_value
        metadata: {}
        data: {}
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "OFF",
              "mode": "color",
              "color": {
                "r": 0,
                "g": 0,
                "b": 0,
                "w": 0
              },
              "brightness": 0
            }
alias: Presence dependant Lamp control
description: ""
