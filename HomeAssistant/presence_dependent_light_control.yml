sequence:
  - if:
      - condition: or
        conditions:
          - type: is_present
            condition: device
            device_id: 7a17b7b44b5d606ef1d850bc75525685
            entity_id: d698de714a27aca18272cf0d4146d90c
            domain: binary_sensor
          - type: is_carbon_dioxide
            condition: device
            device_id: 3253637d30a83f05fc0d82d6f0958558
            entity_id: 692888b5e1b4c32f830b57b2b2a39ec1
            domain: sensor
            above: 500
            below: 1000
          - type: is_sound_pressure
            condition: device
            device_id: 69d6c23daffc370939cf995e2f8507c4
            entity_id: 858b5c3fa043904ecfcd44c4139b006f
            domain: sensor
            above: 30
    then:
      - action: script.get_back_to_normal_for_corresponding_co2_value
        metadata: {}
        data: {}
      - action: script.warmeskript
        metadata: {}
        data: {}
    else:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: home/ledstrip/set
          payload: |-
            {
              "id": "ESP32_LightStrip",
              "state": "OFF",
              "mode": "color",
              "color": {
                "r": 0,
                "g": 0,
                "b": 0,
                "w": 0
              },
              "brightness": 0
            }
alias: Presence dependent Lamp control
description: ""
